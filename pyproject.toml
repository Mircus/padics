[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "padic-ds"
version = "0.1.1"
description = "p-adic foundations for data science: Qp arithmetic, Hensel lifting, balls/ultrametrics, Bruhat–Tits tree, and basic learners."
authors = [{name="HoloMathics / Mirco A. Mannucci"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1",
]
keywords = ["p-adic", "Qp", "ultrametric", "Bruhat-Tits", "Hensel", "data science", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Mircus/padics"
Repository = "https://github.com/Mircus/padics"
Issues = "https://github.com/Mircus/padics/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.8",
    "hypothesis>=6",
]
viz = [
    "matplotlib>=3.6",
]
notebook = [
    "matplotlib>=3.6",
    "jupyter>=1.0",
    "jupytext>=1.16",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/padic"]

[tool.coverage.report]
show_missing = true
